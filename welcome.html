<!doctype html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Home">
      <span class="logo-placeholder" aria-hidden="true">LOGO</span>
      <span class="brand-name">My Website</span>
    </a>

    <div class="preferences">
      <label for="language">
        <span id="languageLabel">Language</span>
        <select id="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select>
      </label>

      <label for="theme">
        <span id="themeLabel">Style</span>
        <select id="theme">
          <option value="ocean">Ocean</option>
          <option value="forest">Forest</option>
          <option value="sunset">Sunset</option>
          <option value="lavender">Lavender</option>
          <option value="earth">Earth</option>
          <option value="berry">Berry</option>
          <option value="sky">Sky</option>
          <option value="sage">Sage</option>
          <option value="coral">Coral</option>
          <option value="monochrome">Monochrome</option>
        </select>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <p class="eyebrow">ACCOUNT</p>
      <h1 id="title">Account</h1>
      <p class="muted" id="message" role="status" aria-live="polite">Checking your sign-in…</p>
      <p id="email"></p>

      <div class="button-row">
        <a class="button secondary" id="profileLink" href="./profile.html">My profile</a>
        <button type="button" id="signOutButton" class="hidden">Sign out</button>
      </div>

      <p class="auth-footer">
        <a id="loginLink" href="./login.html" class="hidden">Return to sign in</a>
      </p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ybdvrgfrhfrznmeafqdz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_n2Rbhasdsel-p60r3M1zEQ_igkqAlbb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const translations = {
      en: {
        language: "Language", theme: "Style", title: "Account", checking: "Checking your sign-in…",
        signedIn: "You’re signed in.", notSignedIn: "You are not signed in.",
        signOut: "Sign out", signingOut: "Signing out…", profile: "My profile",
        login: "Return to sign in", error: "Could not complete the request. Please try again."
      },
      pt: {
        language: "Idioma", theme: "Estilo", title: "Conta", checking: "Verificando seu acesso…",
        signedIn: "Você está conectado.", notSignedIn: "Você não está conectado.",
        signOut: "Sair", signingOut: "Saindo…", profile: "Meu perfil",
        login: "Voltar para entrar", error: "Não foi possível concluir. Tente novamente."
      },
      es: {
        language: "Idioma", theme: "Estilo", title: "Cuenta", checking: "Comprobando tu sesión…",
        signedIn: "Has iniciado sesión.", notSignedIn: "No has iniciado sesión.",
        signOut: "Cerrar sesión", signingOut: "Cerrando sesión…", profile: "Mi perfil",
        login: "Volver a iniciar sesión", error: "No se pudo completar la solicitud. Inténtalo de nuevo."
      }
    };

    const message = document.getElementById("message");
    const signOutButton = document.getElementById("signOutButton");
    const loginLink = document.getElementById("loginLink");
    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");
    let language = localStorage.getItem("siteLanguage") || "en";

    function setLanguage(value) {
      language = translations[value] ? value : "en";
      const t = translations[language];

      localStorage.setItem("siteLanguage", language);
      languageSelect.value = language;
      document.documentElement.lang = language;
      document.getElementById("languageLabel").textContent = t.language;
      document.getElementById("themeLabel").textContent = t.theme;
      document.getElementById("title").textContent = t.title;
      document.getElementById("profileLink").textContent = t.profile;
      loginLink.textContent = t.login;
      signOutButton.textContent = t.signOut;
    }

    function setTheme(value) {
      const isValid = [...themeSelect.options].some(option => option.value === value);
      const theme = isValid ? value : "ocean";

      themeSelect.value = theme;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("siteTheme", theme);
    }

    languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
    themeSelect.addEventListener("change", () => setTheme(themeSelect.value));

    async function checkSession() {
      const { data, error } = await supabaseClient.auth.getSession();

      if (error || !data.session) {
        message.textContent = error
          ? translations[language].error
          : translations[language].notSignedIn;
        loginLink.classList.remove("hidden");
        return;
      }

      message.textContent = translations[language].signedIn;
      document.getElementById("email").textContent = data.session.user.email || "";
      signOutButton.classList.remove("hidden");
    }

    signOutButton.addEventListener("click", async () => {
      signOutButton.disabled = true;
      message.textContent = translations[language].signingOut;

      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        message.textContent = translations[language].error;
        signOutButton.disabled = false;
        return;
      }

      window.location.href = "./index.html";
    });

    setLanguage(language);
    setTheme(localStorage.getItem("siteTheme") || "ocean");
    checkSession();
  </script>
</body>
</html>
