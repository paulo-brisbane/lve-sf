<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar</title>
  <script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <link rel="stylesheet" href="/assets/css/base.css">
</head>
<body class="invisible min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100">

  <header class="bg-white shadow-sm dark:bg-slate-800">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-4">
      <div id="site-logo" class="flex items-baseline gap-1 font-bold tracking-tight"></div>
      <a href="/assets/html/settings.html" class="text-sm font-medium text-slate-600 hover:text-indigo-600 dark:text-slate-300">
        <span>&larr;</span> <span data-i18n="back_to_settings">Back to settings</span>
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-4xl p-6">
    <section class="rounded-2xl bg-white p-6 shadow-lg dark:bg-slate-800 space-y-6">
      <div>
        <h1 data-i18n="avatar_title" class="text-2xl font-semibold">Avatar</h1>
        <p data-i18n="avatar_description" class="text-sm text-slate-500 dark:text-slate-400">Choose a colour for your avatar.</p>
      </div>

      <div id="avatar-preview" class="flex h-20 w-20 items-center justify-center rounded-full bg-indigo-600 text-3xl font-bold text-white">?</div>

      <div class="flex flex-wrap gap-3" role="group">
        <button type="button" data-avatar="indigo" class="h-10 w-10 rounded-full bg-indigo-600"><span data-i18n="avatar_color_indigo" class="sr-only">Indigo</span></button>
        <button type="button" data-avatar="emerald" class="h-10 w-10 rounded-full bg-emerald-600"><span data-i18n="avatar_color_emerald" class="sr-only">Emerald</span></button>
        <button type="button" data-avatar="amber" class="h-10 w-10 rounded-full bg-amber-500"><span data-i18n="avatar_color_amber" class="sr-only">Amber</span></button>
        <button type="button" data-avatar="rose" class="h-10 w-10 rounded-full bg-rose-600"><span data-i18n="avatar_color_rose" class="sr-only">Rose</span></button>
        <button type="button" data-avatar="sky" class="h-10 w-10 rounded-full bg-sky-600"><span data-i18n="avatar_color_sky" class="sr-only">Sky</span></button>
        <button type="button" data-avatar="slate" class="h-10 w-10 rounded-full bg-slate-600"><span data-i18n="avatar_color_slate" class="sr-only">Slate</span></button>
      </div>

      <div class="flex items-center justify-end gap-4 border-t border-slate-200 pt-6 dark:border-slate-700">
        <p id="save-status" role="status" class="hidden text-sm"></p>
        <button id="save-btn" type="button" data-i18n="save"
          class="rounded-lg bg-indigo-600 px-5 py-2 font-semibold text-white hover:bg-indigo-700 disabled:opacity-50">
          Save (Not working yet)
        </button>
      </div>
    </section>
  </main>

  <!-- Hidden strings used by the script. loadLanguage() translates them. -->
  <div hidden>
    <span id="msg-saved" data-i18n="saved">Saved.</span>
    <span id="msg-save-error" data-i18n="save_error">Could not save. Try again.</span>
    <span id="msg-connection-error" data-i18n="connection_error">Connection error. Check your network and try again.</span>
  </div>

  <script type="module" src="/assets/js/pages/avatar.js"></script>
  <script type="module" src="/assets/js/ui/logo.js"></script>
</body>
</html>
