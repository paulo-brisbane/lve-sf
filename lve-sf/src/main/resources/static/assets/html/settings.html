<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <link rel="stylesheet" href="/assets/css/base.css">
</head>
<body class="invisible min-h-screen text-slate-800 dark:text-slate-100">

  <header class="site-header shadow-sm">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-4">
      <div id="site-logo" class="flex items-baseline gap-1 font-bold tracking-tight"></div>
      <a href="/assets/html/client-portal.html" class="text-sm font-medium text-slate-600 hover:text-indigo-600 dark:text-slate-300">
        <span>&larr;</span> <span data-i18n="back_to_portal">Back to portal</span>
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-4xl p-6">
    <h1 data-i18n="settings_title" class="text-3xl font-bold">Settings</h1>
    <p data-i18n="settings_description" class="text-slate-500 dark:text-slate-400">Choose what you want to change.</p>

    <nav class="mt-6 grid gap-4 sm:grid-cols-3" aria-label="Settings sections">
      <a href="/assets/html/avatar.html" class="rounded-2xl bg-[var(--card-bg)] p-6 shadow-lg hover:ring-2 hover:ring-indigo-200 dark:bg-slate-800">
        <h2 data-i18n="settings_avatar_title" class="text-lg font-semibold">Avatar</h2>
        <p data-i18n="settings_avatar_description" class="mt-1 text-sm text-slate-500 dark:text-slate-400">Choose the colour of your avatar.</p>
      </a>
      <a href="/assets/html/language.html" class="rounded-2xl bg-[var(--card-bg)] p-6 shadow-lg hover:ring-2 hover:ring-indigo-200 dark:bg-slate-800">
        <h2 data-i18n="settings_language_title" class="text-lg font-semibold">Language</h2>
        <p data-i18n="settings_language_description" class="mt-1 text-sm text-slate-500 dark:text-slate-400">Choose the language for the portal.</p>
      </a>
      <a href="/assets/html/appearance.html" class="rounded-2xl bg-[var(--card-bg)] p-6 shadow-lg hover:ring-2 hover:ring-indigo-200 dark:bg-slate-800">
        <h2 data-i18n="settings_appearance_title" class="text-lg font-semibold">Appearance</h2>
        <p data-i18n="settings_appearance_description" class="mt-1 text-sm text-slate-500 dark:text-slate-400">Choose light, dark or system theme.</p>
      </a>
    </nav>
  </main>

  <script type="module" src="/assets/js/pages//settings.js"></script>
  <script type="module" src="/assets/js/ui/logo.js"></script>
  <script type="module" src="/assets/js/ui/theme.js"></script>
</body>
</html>
