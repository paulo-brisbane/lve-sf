<!DOCTYPE html>
<html lang="en-GB">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal</title>
  <link rel="stylesheet" href="/assets/css/base.css">
</head>
<body class="invisible min-h-screen text-slate-800">

  <header class="site-header shadow-sm">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-4">
      <div id="site-logo" class="flex items-baseline gap-1 font-bold tracking-tight"></div>
      <div class="relative">
        <button id="user-menu-btn" type="button" aria-haspopup="true" aria-expanded="false"
          class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-100 text-indigo-700 hover:bg-indigo-200">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-7 2-7 4v1h14v-1c0-2-3-4-7-4z" />
          </svg>
        </button>
        <div id="user-menu" class="hidden absolute right-0 z-10 mt-2 w-44 rounded-xl bg-[var(--card-bg)] py-2 shadow-lg ring-1 ring-slate-200">
          <a href="/assets/html/settings.html" data-i18n="portal_menu_settings" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">Settings</a>
          <button id="signout-btn" type="button" data-i18n="portal_menu_sign_out" class="block w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-100">
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-4xl space-y-6 p-6">

    <!-- Loading -->
    <section id="portal-loading" data-i18n="portal_loading" class="py-16 text-center text-slate-500">Loading your account...</section>

    <!-- Error -->
    <section id="portal-error" class="hidden rounded-2xl bg-[var(--card-bg)] p-8 text-center shadow-lg">
      <p id="portal-error-message" class="text-red-600"></p>
      <a href="/assets/html/sign-in.html" data-i18n="portal_go_sign_in" class="mt-4 inline-block font-semibold text-indigo-600 hover:underline">Go to sign in</a>
    </section>

    <!-- Content -->
    <section id="portal-content" class="hidden space-y-6">
      <div>
        <h1 class="text-3xl font-bold">
          <span data-i18n="portal_hello">Hello,</span> <span id="portal-nickname"></span>
        </h1>
        <p data-i18n="portal_welcome" class="text-slate-500">Welcome to this website.</p>
      </div>

      <a href="/assets/html/settings.html" class="block rounded-2xl bg-[var(--card-bg)] p-6 shadow-lg hover:ring-2 hover:ring-indigo-200">
        <h2 data-i18n="portal_settings_title" class="text-lg font-semibold">Settings</h2>
        <p data-i18n="portal_settings_description" class="mt-1 text-sm text-slate-500">Choose what you want to change.</p>
      </a>
    </section>

    <!-- Hidden strings used by the script. loadLanguage() translates them. -->
    <div hidden>
      <span id="msg-fallback-name" data-i18n="portal_fallback_name">there</span>
      <span id="msg-load-error" data-i18n="portal_load_error">Could not load your account. Try again.</span>
      <span id="msg-connection-error" data-i18n="portal_connection_error">Connection error. Check your network and try again.</span>
      <span id="msg-user-menu" data-i18n="portal_user_menu">User menu</span>
    </div>

  </main>

  <script type="module" src="/assets/js/pages/client-portal.js"></script>
  <script type="module" src="/assets/js/ui/logo.js"></script>
  <script type="module" src="/assets/js/ui/theme.js"></script>
</body>
</html>
