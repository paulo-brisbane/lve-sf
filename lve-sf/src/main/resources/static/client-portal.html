<!DOCTYPE html>
<html lang="en">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

  <header class="bg-white shadow-sm">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-4">
      <span class="font-semibold text-indigo-600">Client Portal</span>
      <button id="signout-btn" type="button" class="text-sm font-medium text-slate-600 hover:text-indigo-600">
        Sign out
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-4xl space-y-6 p-6">

    <!-- Loading -->
    <section id="portal-loading" class="py-16 text-center text-slate-500">Loading your account...</section>

    <!-- Error -->
    <section id="portal-error" class="hidden rounded-2xl bg-white p-8 text-center shadow-lg">
      <p id="portal-error-message" class="text-red-600"></p>
      <a href="sign-in.html" class="mt-4 inline-block font-semibold text-indigo-600 hover:underline">Go to sign in</a>
    </section>

    <!-- Content -->
    <section id="portal-content" class="hidden space-y-6">
      <div>
        <h1 class="text-3xl font-bold">Hello, <span id="portal-nickname"></span></h1>
        <p class="text-slate-500">Here is your account summary.</p>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div class="rounded-2xl bg-white p-6 shadow-lg">
          <p class="text-sm text-slate-500">Member since</p>
          <p id="portal-created" class="mt-1 text-2xl font-bold"></p>
        </div>
        <div class="rounded-2xl bg-white p-6 shadow-lg sm:col-span-2">
          <p class="text-sm text-slate-500">Last updated</p>
          <p id="portal-updated" class="mt-1 text-lg font-semibold"></p>
        </div>
      </div>
    </section>

  </main>

  <script>
    const API_BASE = "/api/clients";

    function formatDate(value) {
      if (!value) return "-";
      return new Date(value).toLocaleDateString("en-AU", {
        day: "numeric", month: "long", year: "numeric"
      });
    }

    function showError(message) {
      document.getElementById("portal-loading").classList.add("hidden");
      document.getElementById("portal-content").classList.add("hidden");
      document.getElementById("portal-error-message").textContent = message;
      document.getElementById("portal-error").classList.remove("hidden");
    }

    async function loadPortal() {
      try {
        const response = await fetch(API_BASE + "/me");

        if (response.status === 401) {
          window.location.href = "sign-in.html";
          return;
        }
        if (!response.ok) {
          showError("Could not load your account. Try again.");
          return;
        }

        const client = await response.json();
        document.getElementById("portal-nickname").textContent = client.nickname || "there";
        document.getElementById("portal-created").textContent = formatDate(client.createdAt);
        document.getElementById("portal-updated").textContent = formatDate(client.updatedAt);

        document.getElementById("portal-loading").classList.add("hidden");
        document.getElementById("portal-content").classList.remove("hidden");
      } catch {
        showError("Connection error. Check your network and try again.");
      }
    }

    document.getElementById("signout-btn").addEventListener("click", async () => {
      try {
        await fetch(API_BASE + "/sign-out", { method: "POST" });
      } finally {
        window.location.href = "index.html";
      }
    });

    loadPortal();
  </script>
</body>
</html>
