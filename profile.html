<!doctype html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Home">
      <span class="logo-placeholder" aria-hidden="true">LOGO</span>
      <span class="brand-name">My Website</span>
    </a>

    <div class="preferences">
      <label for="language">
        <span id="languageLabel">Language</span>
        <select id="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select>
      </label>

      <label for="theme">
        <span id="themeLabel">Style</span>
        <select id="theme">
          <option value="ocean">Ocean</option>
          <option value="forest">Forest</option>
          <option value="sunset">Sunset</option>
          <option value="lavender">Lavender</option>
          <option value="earth">Earth</option>
          <option value="berry">Berry</option>
          <option value="sky">Sky</option>
          <option value="sage">Sage</option>
          <option value="coral">Coral</option>
          <option value="monochrome">Monochrome</option>
        </select>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h1 id="title">My profile</h1>
      <p class="muted" id="message" role="status" aria-live="polite">Loading profile…</p>

      <form id="profileForm" class="hidden">
        <div class="field">
          <label for="email" id="emailLabel">Email address</label>
          <input id="email" type="email" readonly>
        </div>
        <div class="field">
          <label for="nickname" id="nicknameLabel">Nickname</label>
          <input id="nickname" type="text" maxlength="40">
        </div>
        <button type="submit" id="saveButton">Save profile</button>
      </form>

      <p class="footer-note">
        <a id="homeLink" href="./index.html">Return to home</a>
      </p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ybdvrgfrhfrznmeafqdz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_n2Rbhasdsel-p60r3M1zEQ_igkqAlbb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const translations = {
      en: {
        language: "Language", theme: "Style", title: "My profile", loading: "Loading profile…",
        email: "Email address", nickname: "Nickname", save: "Save profile", saving: "Saving…",
        saved: "Profile saved.", signedOut: "Please sign in to view your profile.",
        loadError: "Could not load your profile. Check that the profiles table and policies are set up.",
        saveError: "Could not save your profile. Check the profiles table and its RLS policies.",
        home: "Return to home"
      },
      pt: {
        language: "Idioma", theme: "Estilo", title: "Meu perfil", loading: "Carregando perfil…",
        email: "Endereço de e-mail", nickname: "Apelido", save: "Salvar perfil", saving: "Salvando…",
        saved: "Perfil salvo.", signedOut: "Entre para ver seu perfil.",
        loadError: "Não foi possível carregar o perfil. Verifique a tabela profiles e suas políticas.",
        saveError: "Não foi possível salvar. Verifique a tabela profiles e suas políticas.",
        home: "Voltar ao início"
      },
      es: {
        language: "Idioma", theme: "Estilo", title: "Mi perfil", loading: "Cargando perfil…",
        email: "Correo electrónico", nickname: "Apodo", save: "Guardar perfil", saving: "Guardando…",
        saved: "Perfil guardado.", signedOut: "Inicia sesión para ver tu perfil.",
        loadError: "No se pudo cargar el perfil. Comprueba la tabla profiles y sus políticas.",
        saveError: "No se pudo guardar. Comprueba la tabla profiles y sus políticas.",
        home: "Volver al inicio"
      }
    };

    const message = document.getElementById("message");
    const profileForm = document.getElementById("profileForm");
    const saveButton = document.getElementById("saveButton");
    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");
    let language = localStorage.getItem("siteLanguage") || "en";
    let userId;

    function setLanguage(value) {
      language = translations[value] ? value : "en";
      const t = translations[language];

      localStorage.setItem("siteLanguage", language);
      languageSelect.value = language;
      document.documentElement.lang = language;
      document.getElementById("languageLabel").textContent = t.language;
      document.getElementById("themeLabel").textContent = t.theme;
      document.getElementById("title").textContent = t.title;
      document.getElementById("emailLabel").textContent = t.email;
      document.getElementById("nicknameLabel").textContent = t.nickname;
      document.getElementById("homeLink").textContent = t.home;
      saveButton.textContent = t.save;
    }

    function setTheme(value) {
      const isValid = [...themeSelect.options].some(option => option.value === value);
      const theme = isValid ? value : "ocean";

      themeSelect.value = theme;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("siteTheme", theme);
    }

    languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
    themeSelect.addEventListener("change", () => setTheme(themeSelect.value));

    async function loadProfile() {
      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();

      if (sessionError || !sessionData.session) {
        message.textContent = translations[language].signedOut;
        return;
      }

      const user = sessionData.session.user;
      userId = user.id;
      document.getElementById("email").value = user.email || "";

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("nickname")
        .eq("id", userId)
        .maybeSingle();

      if (error) {
        console.error("Profile load error:", error);
        message.textContent = translations[language].loadError;
        return;
      }

      document.getElementById("nickname").value = data?.nickname || "";
      message.textContent = "";
      profileForm.classList.remove("hidden");
    }

    profileForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (!userId) return;

      const t = translations[language];
      message.textContent = "";
      saveButton.disabled = true;
      saveButton.textContent = t.saving;

      const { error } = await supabaseClient.from("profiles").upsert({
        id: userId,
        nickname: document.getElementById("nickname").value.trim(),
        updated_at: new Date().toISOString()
      });

      saveButton.disabled = false;
      saveButton.textContent = t.save;

      if (error) {
        console.error("Profile save error:", error);
        message.textContent = t.saveError;
        return;
      }

      message.textContent = t.saved;
    });

    setLanguage(language);
    setTheme(localStorage.getItem("siteTheme") || "ocean");
    loadProfile();
  </script>
</body>
</html>
