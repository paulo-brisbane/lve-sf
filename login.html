<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-theme="ocean">
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="logo-placeholder" aria-hidden="true">LOGO</span>
      <span>My Website</span>
    </a>
    <div class="preferences">
      <label>
        <span id="languageLabel">Language</span>
        <select id="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select>
      </label>
      <label>
        <span id="themeLabel">Style</span>
        <select id="theme">
          <option value="ocean">Ocean</option>
          <option value="forest">Forest</option>
          <option value="sunset">Sunset</option>
          <option value="lavender">Lavender</option>
          <option value="berry">Berry</option>
          <option value="sand">Sand</option>
          <option value="slate">Slate</option>
          <option value="coral">Coral</option>
          <option value="mint">Mint</option>
          <option value="midnight">Midnight</option>
        </select>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h1 id="title">Sign in</h1>
      <p class="muted" id="description"></p>

      <form id="authForm">
        <div class="field">
          <label for="email" id="emailLabel">Email address</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password" id="passwordLabel">Password</label>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>

        <button type="submit" id="submitButton">Sign in</button>
      </form>

      <div class="button-row" style="margin-top: 12px;">
        <button class="secondary" type="button" id="modeButton">Create account</button>
        <button class="secondary" type="button" id="resetButton">Forgot password?</button>
      </div>

      <p id="message" role="status" aria-live="polite"></p>
      <p class="footer-note"><a id="homeLink" href="index.html">Return to home</a></p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ybdvrgfrhfrznmeafqdz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_n2Rbhasdsel-p60r3M1zEQ_igkqAlbb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const translations = {
      en: {
        language: "Language", theme: "Style", titleIn: "Sign in", titleUp: "Create account",
        descriptionIn: "Enter your email and password to sign in.",
        descriptionUp: "Create an account with your email address and a password.",
        email: "Email address", password: "Password", submitIn: "Sign in",
        submitUp: "Create account", modeIn: "Create account", modeUp: "I already have an account",
        reset: "Forgot password?", sending: "Please wait…",
        signedIn: "Signed in. Opening your account…",
        created: "Account created. If email confirmation is enabled, check your inbox to confirm your address.",
        resetSent: "If an account exists for that address, a password reset email has been sent.",
        resetNeedEmail: "Enter your email address first, then choose “Forgot password?”.",
        error: "Authentication failed. Check your details and try again.",
        home: "Return to home"
      },
      pt: {
        language: "Idioma", theme: "Estilo", titleIn: "Entrar", titleUp: "Criar conta",
        descriptionIn: "Digite seu e-mail e sua senha para entrar.",
        descriptionUp: "Crie uma conta com seu endereço de e-mail e uma senha.",
        email: "Endereço de e-mail", password: "Senha", submitIn: "Entrar",
        submitUp: "Criar conta", modeIn: "Criar conta", modeUp: "Já tenho uma conta",
        reset: "Esqueceu a senha?", sending: "Aguarde…",
        signedIn: "Acesso realizado. Abrindo sua conta…",
        created: "Conta criada. Se a confirmação de e-mail estiver ativada, confira sua caixa de entrada.",
        resetSent: "Se houver uma conta para esse endereço, um e-mail de redefinição foi enviado.",
        resetNeedEmail: "Digite seu e-mail e selecione “Esqueceu a senha?”.",
        error: "Não foi possível autenticar. Confira os dados e tente novamente.",
        home: "Voltar ao início"
      },
      es: {
        language: "Idioma", theme: "Estilo", titleIn: "Iniciar sesión", titleUp: "Crear cuenta",
        descriptionIn: "Introduce tu correo y contraseña para iniciar sesión.",
        descriptionUp: "Crea una cuenta con tu correo electrónico y una contraseña.",
        email: "Correo electrónico", password: "Contraseña", submitIn: "Iniciar sesión",
        submitUp: "Crear cuenta", modeIn: "Crear cuenta", modeUp: "Ya tengo una cuenta",
        reset: "¿Olvidaste tu contraseña?", sending: "Espera…",
        signedIn: "Sesión iniciada. Abriendo tu cuenta…",
        created: "Cuenta creada. Si la confirmación por correo está activada, revisa tu bandeja de entrada.",
        resetSent: "Si existe una cuenta con esa dirección, se ha enviado un correo para restablecer la contraseña.",
        resetNeedEmail: "Introduce tu correo y selecciona “¿Olvidaste tu contraseña?”.",
        error: "No se pudo iniciar sesión. Comprueba tus datos e inténtalo de nuevo.",
        home: "Volver al inicio"
      }
    };

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const modeButton = document.getElementById("modeButton");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");
    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");

    let language = localStorage.getItem("siteLanguage") || "en";
    let isSignUp = false;

    function setLanguage(value) {
      language = translations[value] ? value : "en";
      localStorage.setItem("siteLanguage", language);
      languageSelect.value = language;
      document.documentElement.lang = language;
      const t = translations[language];

      document.getElementById("languageLabel").textContent = t.language;
      document.getElementById("themeLabel").textContent = t.theme;
      document.getElementById("emailLabel").textContent = t.email;
      document.getElementById("passwordLabel").textContent = t.password;
      document.getElementById("resetButton").textContent = t.reset;
      document.getElementById("homeLink").textContent = t.home;
      updateModeText();
    }

    function updateModeText() {
      const t = translations[language];
      document.getElementById("title").textContent = isSignUp ? t.titleUp : t.titleIn;
      document.getElementById("description").textContent = isSignUp ? t.descriptionUp : t.descriptionIn;
      submitButton.textContent = isSignUp ? t.submitUp : t.submitIn;
      modeButton.textContent = isSignUp ? t.modeUp : t.modeIn;
      passwordInput.autocomplete = isSignUp ? "new-password" : "current-password";
    }

    function setTheme(theme) {
      const allowed = [...themeSelect.options].map(option => option.value);
      const selected = allowed.includes(theme) ? theme : "ocean";
      document.body.dataset.theme = selected;
      themeSelect.value = selected;
      localStorage.setItem("siteTheme", selected);
    }

    languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
    themeSelect.addEventListener("change", () => setTheme(themeSelect.value));

    modeButton.addEventListener("click", () => {
      isSignUp = !isSignUp;
      message.textContent = "";
      updateModeText();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const t = translations[language];
      message.textContent = "";
      submitButton.disabled = true;
      submitButton.textContent = t.sending;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      let result;
      if (isSignUp) {
        result = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: new URL("welcome.html", window.location.href).toString()
          }
        });
      } else {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      }

      submitButton.disabled = false;
      updateModeText();

      if (result.error) {
        console.error("Supabase auth error:", result.error);
        message.textContent = t.error;
        return;
      }

      if (isSignUp) {
        message.textContent = t.created;
        if (result.data.session) {
          window.location.href = "welcome.html";
        }
      } else {
        message.textContent = t.signedIn;
        window.location.href = "welcome.html";
      }
    });

    resetButton.addEventListener("click", async () => {
      const t = translations[language];
      const email = emailInput.value.trim();

      if (!email) {
        message.textContent = t.resetNeedEmail;
        emailInput.focus();
        return;
      }

      resetButton.disabled = true;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: new URL("welcome.html", window.location.href).toString()
      });
      resetButton.disabled = false;

      if (error) {
        console.error("Password reset error:", error);
        message.textContent = t.error;
      } else {
        message.textContent = t.resetSent;
      }
    });

    setLanguage(language);
    setTheme(localStorage.getItem("siteTheme") || "ocean");
  </script>
</body>
</html>
