<!doctype html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Home">
      <span class="logo-placeholder" aria-hidden="true">LOGO</span>
      <span class="brand-name">My Website</span>
    </a>

    <div class="header-controls">
      <label for="language">
        <span id="languageLabel">Language</span>
        <select id="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select>
      </label>

      <label for="theme">
        <span id="themeLabel">Colour style</span>
        <select id="theme">
          <option value="ocean">Ocean</option>
          <option value="forest">Forest</option>
          <option value="sunset">Sunset</option>
          <option value="lavender">Lavender</option>
          <option value="earth">Earth</option>
          <option value="berry">Berry</option>
          <option value="sky">Sky</option>
          <option value="sage">Sage</option>
          <option value="coral">Coral</option>
          <option value="monochrome">Monochrome</option>
        </select>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h1 id="title">Sign in</h1>
      <p class="muted" id="description">Enter your email and password to sign in.</p>

      <form id="authForm" class="auth-form">
        <div class="field">
          <label for="email" id="emailLabel">Email address</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password" id="passwordLabel">Password</label>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>

        <button class="button" type="submit" id="submitButton">Sign in</button>
      </form>

      <div class="auth-actions">
        <button class="button secondary" type="button" id="modeButton">Create account</button>
        <button class="button secondary" type="button" id="resetButton">Forgot password?</button>
      </div>

      <p id="message" role="status" aria-live="polite"></p>
      <p class="auth-footer">
        <a id="homeLink" href="./index.html">Return to home</a>
      </p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ybdvrgfrhfrznmeafqdz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_n2Rbhasdsel-p60r3M1zEQ_igkqAlbb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const translations = {
      en: {
        titleIn: "Sign in",
        titleUp: "Create account",
        descriptionIn: "Enter your email and password to sign in.",
        descriptionUp: "Create an account with your email address and a password.",
        language: "Language",
        theme: "Colour style",
        email: "Email address",
        password: "Password",
        submitIn: "Sign in",
        submitUp: "Create account",
        modeIn: "Create account",
        modeUp: "I already have an account",
        reset: "Forgot password?",
        sending: "Please wait…",
        signedIn: "Signed in. Opening your account…",
        created: "Account created. Check your email if confirmation is required.",
        resetSent: "If an account exists for that address, a password reset email has been sent.",
        resetNeedEmail: "Enter your email address first, then choose “Forgot password?”.",
        error: "Authentication failed. Check your details and try again.",
        home: "Return to home"
      },
      pt: {
        titleIn: "Entrar",
        titleUp: "Criar conta",
        descriptionIn: "Digite seu e-mail e sua senha para entrar.",
        descriptionUp: "Crie uma conta com seu endereço de e-mail e uma senha.",
        language: "Idioma",
        theme: "Estilo de cores",
        email: "Endereço de e-mail",
        password: "Senha",
        submitIn: "Entrar",
        submitUp: "Criar conta",
        modeIn: "Criar conta",
        modeUp: "Já tenho uma conta",
        reset: "Esqueceu a senha?",
        sending: "Aguarde…",
        signedIn: "Acesso realizado. Abrindo sua conta…",
        created: "Conta criada. Confira seu e-mail caso seja necessária uma confirmação.",
        resetSent: "Se houver uma conta para esse endereço, um e-mail de redefinição foi enviado.",
        resetNeedEmail: "Digite seu e-mail e selecione “Esqueceu a senha?”.",
        error: "Não foi possível autenticar. Confira os dados e tente novamente.",
        home: "Voltar ao início"
      },
      es: {
        titleIn: "Iniciar sesión",
        titleUp: "Crear cuenta",
        descriptionIn: "Introduce tu correo y contraseña para iniciar sesión.",
        descriptionUp: "Crea una cuenta con tu correo electrónico y una contraseña.",
        language: "Idioma",
        theme: "Estilo de color",
        email: "Correo electrónico",
        password: "Contraseña",
        submitIn: "Iniciar sesión",
        submitUp: "Crear cuenta",
        modeIn: "Crear cuenta",
        modeUp: "Ya tengo una cuenta",
        reset: "¿Olvidaste tu contraseña?",
        sending: "Espera…",
        signedIn: "Sesión iniciada. Abriendo tu cuenta…",
        created: "Cuenta creada. Revisa tu correo si se requiere confirmación.",
        resetSent: "Si existe una cuenta con esa dirección, se ha enviado un correo para restablecer la contraseña.",
        resetNeedEmail: "Introduce tu correo y selecciona “¿Olvidaste tu contraseña?”.",
        error: "No se pudo autenticar. Comprueba tus datos e inténtalo de nuevo.",
        home: "Volver al inicio"
      }
    };

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const modeButton = document.getElementById("modeButton");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");
    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");

    let language = localStorage.getItem("siteLanguage") || "en";
    let isSignUp = false;

    function updateModeText() {
      const text = translations[language];
      document.getElementById("title").textContent = isSignUp ? text.titleUp : text.titleIn;
      document.getElementById("description").textContent = isSignUp ? text.descriptionUp : text.descriptionIn;
      submitButton.textContent = isSignUp ? text.submitUp : text.submitIn;
      modeButton.textContent = isSignUp ? text.modeUp : text.modeIn;
      passwordInput.autocomplete = isSignUp ? "new-password" : "current-password";
    }

    function setLanguage(value) {
      language = translations[value] ? value : "en";
      const text = translations[language];

      languageSelect.value = language;
      document.documentElement.lang = language;
      document.title = isSignUp ? text.titleUp : text.titleIn;
      document.getElementById("languageLabel").textContent = text.language;
      document.getElementById("themeLabel").textContent = text.theme;
      document.getElementById("emailLabel").textContent = text.email;
      document.getElementById("passwordLabel").textContent = text.password;
      document.getElementById("homeLink").textContent = text.home;
      resetButton.textContent = text.reset;

      localStorage.setItem("siteLanguage", language);
      updateModeText();
    }

    function setTheme(value) {
      const isValid = [...themeSelect.options].some(option => option.value === value);
      const theme = isValid ? value : "ocean";

      themeSelect.value = theme;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("siteTheme", theme);
    }

    languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
    themeSelect.addEventListener("change", () => setTheme(themeSelect.value));

    modeButton.addEventListener("click", () => {
      isSignUp = !isSignUp;
      message.textContent = "";
      updateModeText();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const text = translations[language];
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      message.textContent = "";
      submitButton.disabled = true;
      modeButton.disabled = true;
      resetButton.disabled = true;
      submitButton.textContent = text.sending;

      try {
        let result;

        if (isSignUp) {
          result = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: new URL("welcome.html", window.location.href).toString()
            }
          });
        } else {
          result = await supabaseClient.auth.signInWithPassword({ email, password });
        }

        if (result.error) {
          console.error("Supabase authentication error:", result.error);
          message.textContent = text.error;
          return;
        }

        if (isSignUp) {
          message.textContent = text.created;
          if (result.data.session) {
            window.location.href = "./welcome.html";
          }
        } else {
          message.textContent = text.signedIn;
          window.location.href = "./welcome.html";
        }
      } catch (error) {
        console.error("Authentication request failed:", error);
        message.textContent = text.error;
      } finally {
        submitButton.disabled = false;
        modeButton.disabled = false;
        resetButton.disabled = false;
        updateModeText();
      }
    });

    resetButton.addEventListener("click", async () => {
      const text = translations[language];
      const email = emailInput.value.trim();

      if (!email) {
        message.textContent = text.resetNeedEmail;
        emailInput.focus();
        return;
      }

      resetButton.disabled = true;
      message.textContent = "";

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: new URL("welcome.html", window.location.href).toString()
        });

        if (error) {
          console.error("Password reset error:", error);
          message.textContent = text.error;
        } else {
          message.textContent = text.resetSent;
        }
      } catch (error) {
        console.error("Password reset request failed:", error);
        message.textContent = text.error;
      } finally {
        resetButton.disabled = false;
      }
    });

    setLanguage(language);
    setTheme(localStorage.getItem("siteTheme") || "ocean");
  </script>
</body>
</html>
