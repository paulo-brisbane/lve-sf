<!doctype html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Home">
      <span class="logo-placeholder" aria-hidden="true">LOGO</span>
      <span class="brand-name">Your Website</span>
    </a>

    <div class="header-controls">
      <label class="sr-only" for="language">Language</label>
      <select id="language" aria-label="Language">
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
      </select>

      <label class="sr-only" for="theme">Colour style</label>
      <select id="theme" aria-label="Colour style">
        <option value="ocean">Ocean</option>
        <option value="forest">Forest</option>
        <option value="sunset">Sunset</option>
        <option value="lavender">Lavender</option>
        <option value="earth">Earth</option>
        <option value="berry">Berry</option>
        <option value="sky">Sky</option>
        <option value="sage">Sage</option>
        <option value="coral">Coral</option>
        <option value="monochrome">Monochrome</option>
      </select>
    </div>
  </header>

  <main class="main-content">
    <section class="welcome-card">
      <p class="eyebrow" id="eyebrow">HOME</p>
      <h1 id="heading">Welcome</h1>
      <p id="description">
        Welcome to your website. Use the selectors above to choose your language
        and colour style.
      </p>
    </section>
  </main>

  <script>
    const translations = {
      en: {
        title: "Home",
        eyebrow: "HOME",
        heading: "Welcome",
        description:
          "Welcome to your website. Use the selectors above to choose your language and colour style."
      },
      pt: {
        title: "Início",
        eyebrow: "INÍCIO",
        heading: "Boas-vindas",
        description:
          "Boas-vindas ao seu site. Use os seletores acima para escolher o idioma e o estilo de cores."
      },
      es: {
        title: "Inicio",
        eyebrow: "INICIO",
        heading: "Bienvenido",
        description:
          "Te damos la bienvenida a tu sitio web. Usa los selectores de arriba para elegir el idioma y el estilo de colores."
      }
    };

    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");

    function setLanguage(language) {
      const text = translations[language] || translations.en;

      document.documentElement.lang = language;
      document.title = text.title;
      document.getElementById("eyebrow").textContent = text.eyebrow;
      document.getElementById("heading").textContent = text.heading;
      document.getElementById("description").textContent = text.description;

      localStorage.setItem("siteLanguage", language);
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("siteTheme", theme);
    }

    const savedLanguage = localStorage.getItem("siteLanguage") || "en";
    const savedTheme = localStorage.getItem("siteTheme") || "ocean";

    languageSelect.value = translations[savedLanguage] ? savedLanguage : "en";
    themeSelect.value = themeSelect.querySelector(
      `option[value="${CSS.escape(savedTheme)}"]`
    ) ? savedTheme : "ocean";

    setLanguage(languageSelect.value);
    setTheme(themeSelect.value);

    languageSelect.addEventListener("change", () => {
      setLanguage(languageSelect.value);
    });

    themeSelect.addEventListener("change", () => {
      setTheme(themeSelect.value);
    });
  </script>
</body>
</html>
