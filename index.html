<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Home">
      <span class="logo-placeholder" aria-hidden="true">LOGO</span>
      <span id="brandName">My Website</span>
    </a>

    <nav class="header-actions" aria-label="Main navigation">
      <a id="profileLink" href="profile.html">My Profile</a>
      <a id="loginLink" href="login.html">Sign in</a>
      <button id="signOutButton" type="button" hidden>Sign out</button>
      <select id="language" aria-label="Language">
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
      </select>
      <select id="theme" aria-label="Colour theme">
        <option value="ocean">Ocean</option>
        <option value="forest">Forest</option>
        <option value="sunset">Sunset</option>
        <option value="lavender">Lavender</option>
        <option value="rose">Rose</option>
        <option value="citrus">Citrus</option>
        <option value="slate">Slate</option>
        <option value="mint">Mint</option>
        <option value="berry">Berry</option>
        <option value="sand">Sand</option>
      </select>
    </nav>
  </header>

  <main>
    <section class="card">
      <h1 id="title">Welcome</h1>
      <p id="description" class="muted">This is your website home page.</p>
      <p id="sessionStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ybdvrgfrhfrznmeafqdz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_n2Rbhasdsel-p60r3M1zEQ_igkqAlbb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const translations = {
      en: {
        brand: "My Website", title: "Welcome",
        description: "This is your website home page.",
        profile: "My Profile", login: "Sign in", signOut: "Sign out",
        signedIn: "You are signed in.", signedOut: "You are not signed in."
      },
      pt: {
        brand: "Meu site", title: "Bem-vindo",
        description: "Esta é a página inicial do seu site.",
        profile: "Meu perfil", login: "Entrar", signOut: "Sair",
        signedIn: "Você está conectado.", signedOut: "Você não está conectado."
      },
      es: {
        brand: "Mi sitio", title: "Bienvenido",
        description: "Esta es la página de inicio de tu sitio.",
        profile: "Mi perfil", login: "Iniciar sesión", signOut: "Cerrar sesión",
        signedIn: "Has iniciado sesión.", signedOut: "No has iniciado sesión."
      }
    };

    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");
    const savedLanguage = localStorage.getItem("siteLanguage") || "en";
    const savedTheme = localStorage.getItem("siteTheme") || "ocean";

    function setLanguage(language) {
      const lang = translations[language] ? language : "en";
      const t = translations[lang];
      localStorage.setItem("siteLanguage", lang);
      languageSelect.value = lang;
      document.documentElement.lang = lang;
      document.getElementById("brandName").textContent = t.brand;
      document.getElementById("title").textContent = t.title;
      document.getElementById("description").textContent = t.description;
      document.getElementById("profileLink").textContent = t.profile;
      document.getElementById("loginLink").textContent = t.login;
      document.getElementById("signOutButton").textContent = t.signOut;
      document.getElementById("sessionStatus").textContent =
        document.getElementById("sessionStatus").dataset.signedIn === "true"
          ? t.signedIn : t.signedOut;
    }

    function setTheme(theme) {
      const validThemes = ["ocean", "forest", "sunset", "lavender", "rose",
        "citrus", "slate", "mint", "berry", "sand"];
      const selected = validThemes.includes(theme) ? theme : "ocean";
      document.body.dataset.theme = selected;
      themeSelect.value = selected;
      localStorage.setItem("siteTheme", selected);
    }

    languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
    themeSelect.addEventListener("change", () => setTheme(themeSelect.value));

    document.getElementById("signOutButton").addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        document.getElementById("sessionStatus").textContent = error.message;
        return;
      }
      window.location.reload();
    });

    async function initialisePage() {
      setTheme(savedTheme);
      setLanguage(savedLanguage);

      const { data } = await supabaseClient.auth.getSession();
      const signedIn = Boolean(data.session);
      const status = document.getElementById("sessionStatus");
      status.dataset.signedIn = String(signedIn);
      status.textContent = translations[languageSelect.value][signedIn ? "signedIn" : "signedOut"];

      document.getElementById("loginLink").hidden = signedIn;
      document.getElementById("signOutButton").hidden = !signedIn;
    }

    initialisePage();
  </script>
</body>
</html>
