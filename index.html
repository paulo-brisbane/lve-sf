<!doctype html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Home">
      <span class="logo-placeholder" aria-hidden="true">LOGO</span>
      <span class="brand-name">Your Website</span>
    </a>

    <div class="header-actions">
      <div class="preferences">
        <label>
          <span id="languageLabel">Language</span>
          <select id="language" aria-label="Language">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="es">Español</option>
          </select>
        </label>

        <label>
          <span id="themeLabel">Colour style</span>
          <select id="theme" aria-label="Colour style">
            <option value="ocean">Ocean</option>
            <option value="forest">Forest</option>
            <option value="sunset">Sunset</option>
            <option value="lavender">Lavender</option>
            <option value="earth">Earth</option>
            <option value="berry">Berry</option>
            <option value="sky">Sky</option>
            <option value="sage">Sage</option>
            <option value="coral">Coral</option>
            <option value="monochrome">Monochrome</option>
          </select>
        </label>
      </div>

      <a class="button" id="loginLink" href="./login.html">Login</a>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <p class="eyebrow" id="eyebrow">HOME</p>
      <h1 id="heading">Welcome</h1>
      <p class="muted" id="description">
        Welcome to your website. Use the selectors above to choose your language
        and colour style.
      </p>
    </section>
  </main>

  <script>
    const translations = {
      en: {
        title: "Home",
        language: "Language",
        theme: "Colour style",
        login: "Login",
        eyebrow: "HOME",
        heading: "Welcome",
        description: "Welcome to your website. Use the selectors above to choose your language and colour style."
      },
      pt: {
        title: "Início",
        language: "Idioma",
        theme: "Estilo de cores",
        login: "Entrar",
        eyebrow: "INÍCIO",
        heading: "Boas-vindas",
        description: "Boas-vindas ao seu site. Use os seletores acima para escolher o idioma e o estilo de cores."
      },
      es: {
        title: "Inicio",
        language: "Idioma",
        theme: "Estilo de color",
        login: "Iniciar sesión",
        eyebrow: "INICIO",
        heading: "Bienvenido",
        description: "Te damos la bienvenida a tu sitio web. Usa los selectores de arriba para elegir el idioma y el estilo de color."
      }
    };

    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");

    function setLanguage(value) {
      const language = translations[value] ? value : "en";
      const text = translations[language];

      languageSelect.value = language;
      document.documentElement.lang = language;
      document.title = text.title;
      document.getElementById("languageLabel").textContent = text.language;
      document.getElementById("themeLabel").textContent = text.theme;
      document.getElementById("loginLink").textContent = text.login;
      document.getElementById("eyebrow").textContent = text.eyebrow;
      document.getElementById("heading").textContent = text.heading;
      document.getElementById("description").textContent = text.description;

      localStorage.setItem("siteLanguage", language);
    }

    function setTheme(value) {
      const isValid = [...themeSelect.options].some(option => option.value === value);
      const theme = isValid ? value : "ocean";

      themeSelect.value = theme;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("siteTheme", theme);
    }

    languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
    themeSelect.addEventListener("change", () => setTheme(themeSelect.value));

    setLanguage(localStorage.getItem("siteLanguage") || "en");
    setTheme(localStorage.getItem("siteTheme") || "ocean");
  </script>
</body>
</html>
