<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 10vh auto;
      padding: 24px;
      color: #222;
    }

    label, input, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }

    input, button {
      padding: 12px;
      margin-top: 8px;
      font-size: 1rem;
    }

    button {
      margin-top: 16px;
      cursor: pointer;
    }

    #message {
      min-height: 1.5em;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <p>Enter your email and we’ll send you a sign-in link. No password needed.</p>

  <form id="sign-in-form">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <button id="submit-button" type="submit">Send sign-in link</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ybdvrgfrhfrznmeafqdz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_n2Rbhasdsel-p60r3M1zEQ_igkqAlbb";
    const SITE_URL = "https://paulo-brisbane.github.io/lve-sf/";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("sign-in-form");
    const emailInput = document.getElementById("email");
    const submitButton = document.getElementById("submit-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitButton.disabled = true;
      message.textContent = "Sending sign-in link…";

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: emailInput.value.trim(),
        options: {
          emailRedirectTo: `${SITE_URL}welcome.html`
        }
      });

      submitButton.disabled = false;

      if (error) {
        message.textContent = `Could not send the link: ${error.message}`;
        return;
      }

      message.textContent =
        "If this email can sign in, a link is on its way. Check your inbox.";
    });
  </script>
</body>
</html>
