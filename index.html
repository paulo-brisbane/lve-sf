<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769aa">
  <title>Sign in</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <div class="preferences">
      <div class="preference">
        <label for="language" id="languageLabel">Language</label>
        <select id="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select>
      </div>

      <div class="preference">
        <label for="theme" id="themeLabel">Colour style</label>
        <select id="theme">
          <option value="ocean">Ocean</option>
          <option value="forest">Forest</option>
          <option value="sunset">Sunset</option>
          <option value="lavender">Lavender</option>
          <option value="rose">Rose</option>
          <option value="citrus">Citrus</option>
          <option value="monochrome">Monochrome</option>
          <option value="teal">Teal</option>
          <option value="coral">Coral</option>
          <option value="midnight">Midnight</option>
        </select>
      </div>
    </div>

    <h1 id="title">Sign in with an email link</h1>
    <p class="description" id="description">
      Enter your email address and we’ll send you a sign-in link. No password needed.
    </p>

    <form id="signInForm">
      <label for="email" id="emailLabel">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >
      <button id="submitButton" type="submit">Send sign-in link</button>
    </form>

    <p class="status" id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://ybdvrgfrhfrznmeafqdz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_n2Rbhasdsel-p60r3M1zEQ_igkqAlbb";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const translations = {
      en: {
        language: "Language",
        theme: "Colour style",
        title: "Sign in with an email link",
        description: "Enter your email address and we’ll send you a sign-in link. No password needed.",
        email: "Email address",
        placeholder: "you@example.com",
        submit: "Send sign-in link",
        sending: "Sending…",
        sent: "Check your email for the sign-in link.",
        rateLimit: "Too many emails were requested. Please wait a while and try again.",
        error: "Could not send the sign-in link. Please try again."
      },
      pt: {
        language: "Idioma",
        theme: "Estilo de cores",
        title: "Entre com um link enviado por e-mail",
        description: "Digite seu e-mail e enviaremos um link para entrar. Não é necessária uma senha.",
        email: "Endereço de e-mail",
        placeholder: "voce@exemplo.com",
        submit: "Enviar link de acesso",
        sending: "Enviando…",
        sent: "Verifique seu e-mail para encontrar o link de acesso.",
        rateLimit: "Muitos e-mails foram solicitados. Aguarde um pouco e tente novamente.",
        error: "Não foi possível enviar o link. Tente novamente."
      },
      es: {
        language: "Idioma",
        theme: "Estilo de color",
        title: "Inicia sesión con un enlace por correo",
        description: "Introduce tu correo y te enviaremos un enlace para iniciar sesión. No necesitas contraseña.",
        email: "Correo electrónico",
        placeholder: "tu@ejemplo.com",
        submit: "Enviar enlace de acceso",
        sending: "Enviando…",
        sent: "Revisa tu correo para encontrar el enlace de acceso.",
        rateLimit: "Se solicitaron demasiados correos. Espera un poco e inténtalo de nuevo.",
        error: "No se pudo enviar el enlace. Inténtalo de nuevo."
      }
    };

    const themeNames = {
      en: ["Ocean", "Forest", "Sunset", "Lavender", "Rose", "Citrus", "Monochrome", "Teal", "Coral", "Midnight"],
      pt: ["Oceano", "Floresta", "Pôr do sol", "Lavanda", "Rosa", "Cítrico", "Monocromático", "Verde-azulado", "Coral", "Meia-noite"],
      es: ["Océano", "Bosque", "Atardecer", "Lavanda", "Rosa", "Cítrico", "Monocromático", "Verde azulado", "Coral", "Medianoche"]
    };

    const languageSelect = document.getElementById("language");
    const themeSelect = document.getElementById("theme");
    const form = document.getElementById("signInForm");
    const emailInput = document.getElementById("email");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let currentLanguage = localStorage.getItem("siteLanguage") || "en";

    function setLanguage(language) {
      currentLanguage = translations[language] ? language : "en";
      localStorage.setItem("siteLanguage", currentLanguage);
      languageSelect.value = currentLanguage;
      document.documentElement.lang = currentLanguage;

      const text = translations[currentLanguage];
      document.title = text.title;
      document.getElementById("languageLabel").textContent = text.language;
      document.getElementById("themeLabel").textContent = text.theme;
      document.getElementById("title").textContent = text.title;
      document.getElementById("description").textContent = text.description;
      document.getElementById("emailLabel").textContent = text.email;
      emailInput.placeholder = text.placeholder;

      if (!submitButton.disabled) {
        submitButton.textContent = text.submit;
      }

      [...themeSelect.options].forEach((option, index) => {
        option.textContent = themeNames[currentLanguage][index];
      });
    }

    function setTheme(theme) {
      const allowedThemes = [...themeSelect.options].map((option) => option.value);
      const selectedTheme = allowedThemes.includes(theme) ? theme : "ocean";

      document.documentElement.dataset.theme = selectedTheme;
      themeSelect.value = selectedTheme;
      localStorage.setItem("siteTheme", selectedTheme);
    }

    languageSelect.addEventListener("change", () => {
      setLanguage(languageSelect.value);
    });

    themeSelect.addEventListener("change", () => {
      setTheme(themeSelect.value);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = translations[currentLanguage];
      message.textContent = "";
      submitButton.disabled = true;
      submitButton.textContent = text.sending;

      const emailRedirectTo = new URL("welcome.html", window.location.href).toString();

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email: emailInput.value.trim(),
          options: {
            emailRedirectTo,
            shouldCreateUser: true
          }
        });

        if (error) {
          console.error("Supabase sign-in error:", error);
          message.textContent = /rate limit|too many/i.test(error.message)
            ? text.rateLimit
            : text.error;
          return;
        }

        message.textContent = text.sent;
      } catch (error) {
        console.error("Sign-in request failed:", error);
        message.textContent = text.error;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = translations[currentLanguage].submit;
      }
    });

    setLanguage(currentLanguage);
    setTheme(localStorage.getItem("siteTheme") || "ocean");
  </script>
</body>
</html>
